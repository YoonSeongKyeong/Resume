about_content: | # this will include new lines to allow paragraphs
  비즈니스 밸류가 높은 문제를 찾고, 안되면 될 때까지 도전해서 결국 해낸 경험이 많은 **문제 해결 전문가**입니다.

  4년 6개월간 일 12TB, 약 3000여종의 이벤트 데이터를 처리하는 데이터 플랫폼에서 <mark>end-to-end 시스템 개발 및 운영</mark> 경험을 토대로 이슈 대응, 프로세스 개선, 신규 서비스 개발, <mark>비용 최적화</mark>에 기여했습니다.

  주도적 태도로 문제를 찾고 분석하고 해결하는 과정을 통해 대규모 자동화 시스템 내 로직을 안정화하고 최적화하고 문서화하여 실질적 <mark>데이터 품질 향상</mark>에 앞장섰습니다.
  

content:
  - title: Experience # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: 베이글코드 (Bagelcode)
        link: bagelcode.com
        sub_title: Data Engineer, Data Service Team Jr. Manager, Individual Contributor
        caption: 2020.04 - 2024.10
        quote: >
          전 세계 4000만명 이상 유저들이 플레이하는 글로벌 게임 회사로 2024년 11월 기준 지난 5년간 60%의 매출 성장률을 보이며 전년도 1062억원 매출을 달성했습니다.
          일 12TB, 3000여종의 이벤트를 처리하며 Data&AI 팀 규모는 20~30인 입니다.
          Junior Data Engineer로 시작하여 팀의 성장에 기여하며 Data Service Team Junior Manager, Individual Contributer 등의 역할로 성장했습니다.
        description: | # this will include new lines to allow paragraphs
          **Cost Optimizer**
          - Data Pipeline의 비용 관리를 위한 모니터링 시스템을 최초로 구축하고, 이를 전사적 Infra 비용 모니터링 시스템으로 확장하여 비용 최적화 문화를 조성하고 주도했습니다.
          - 일자별, 세부 항목별 비용 변화 추이를 분석/추적하여 비용 급증 사고를 사전에 방지하고 여러 리소스에서 다양한 방법으로 비용 최적화를 달성했습니다.
          - AWS 인프라 비용 10% 이상 절감 사례를 다수 확보했으며, 최대 비용 쿼리 6종에 대해 약 40%의 비용을 감소시켰습니다.
          - 데이터 정합성이 완전히 일치해야 하는 대형 쿼리 작업들에서 최적화 및 검증 작업을 성공시키고 작업 비용을 크게 줄였습니다.

          **Data Infrastructure Manager**
          - Infra Admin 권한 및 책임을 가지고 Kubernetes, Airflow, Databricks, Kafka 등 핵심 데이터 인프라의 개발, 운영, 이슈 해결, 프로세스 최적화를 주도했습니다.
          - 반복되는 작업을 위한 프로세스 개발 및 체크리스트화를 통해 휴먼 에러를 줄이고 작업 효율성을 높였습니다.

          **Data Service Developer**
          - CRM Pipeline, GUI Query Service, Data Gateway(모든 방식의 쿼리 제공) 시스템을 전담하여 개발, 운영했습니다.
          - 사용자 피드백과 운영 노하우를 바탕으로 Data Gateway 시스템을 재설계하여 안정성, 확장성, 사용 편의성을 크게 향상시켰습니다.
          - 높은 커버리지 테스트, 무중단 배포, 신규 쿼리 재배포 없는 등록/검증 시스템을 도입하여 Almost Zero Downtime을 실현하고, 20ms 이내 응답, 초당 30회 요청 처리 등 고성능 데이터 서비스의 안정성을 확보했습니다.

          **Technical Supporter**
          - on-call 및 데이터 팀 공식 소통 채널(data-help) 담당자로서 데이터 관련 전 분야의 이슈를 해결하며 높은 데이터 품질을 보장했습니다.
          - Business KPI Pipeline의 e2e 오너십을 갖고 기술 지원 및 User Acquisition 팀의 Pain Point를 해결하는 Product를 개발, 제공하여 주요 비즈니스 의사결정 속도를 단축시키는 데 기여했습니다.
          - 팀의 핵심 히스토리와 노하우를 문서화/프로세스화하여 공유함으로써 온보딩 비용을 줄이고 팀의 전체적인 이슈 대응 역량을 강화했습니다.

  - title: Skills
    layout: list
    content:
      - layout: top-middle
        title: Data & Pipeline
        description: |
          - Data System: 전체 데이터 파이프라인 및 시스템(ETL, Data Serving Layer)을 책임지고 개발, 운영, 관리하며 지속적으로 개선하고 모듈화한 경험
          - Spark & Databricks: Databricks 환경에서 SQL을 포함한 ETL 개발, 로직 개선, 비용 최적화, 이슈 대응 및 운영 경험 (일 12TB 데이터, 3000여 종 이벤트 처리)
          - Airflow: 200개 이상의 DAG, 일 15,000건의 작업을 처리하는 Airflow 환경에서 코드 컨벤션 수립, 모듈화, 최적화 및 안정화 경험
      - layout: top-middle
        title: Infrastructure & DevOps
        description: |
          - Container: Docker, Kubernetes, Helm, Helmfile을 사용한 서비스 개발, 배포 및 트러블슈팅 경험
          - IaC: Terraform, AWS CDK를 활용한 인프라 코드 관리 및 배포 경험
          - CI/CD: Gitlab CI/CD, Github Actions를 활용한 배포 자동화 및 사내 CI/CD 패턴 제안 및 적용 경험
          - AWS: IAM, VPC, EKS, S3, Lambda 등 주요 서비스를 활용하여 전체 인프라를 오너십을 갖고 개발 및 관리한 경험
          - (keyword): Kubernetes, Airflow, Schema Registry, Data Gateway, Apache Spark(Databricks), Databricks SQL, Superset, Datahub, Realtime Query Pipeline, AWS Redshift, ELK, Tableau, Github CI/CD, Serverless, Terraform, Kafka Event Server, Prometheus, Security System
      - layout: top-middle
        title: Back-End & Database
        description: |
          - Go: Lock-Free 멀티스레딩 설계, JSON Validator, JSON to SQL Parser 개발 등 고성능이 요구되는 시스템 개발 및 개선 경험
          - Python: Airflow DAG 개발, 자체 모듈 개발을 통한 리팩토링 및 코드 개선 주도 경험. 데이터 시스템 개발과 프로젝트 고도화 경험.
          - RDBMS: MySQL 기반의 테이블 설계 및 ORM 활용 경험
          - Lakehouse: Databricks SQL을 활용한 실시간 OLAP 집계 쿼리 서비스 관리 경험
          - NoSQL: Google Firestore, AWS DynamoDB를 이용한 시스템 설계 및 관리 경험

